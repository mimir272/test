<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Earth Jukebox · Time-lapse</title>
<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<style>
  body { margin:0; background:#0b0f14; color:#e6edf3; font-family:system-ui,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:1.5rem; }
  h1 { font-weight:600; margin:0 0 .25rem; }
  .sub { color:#9aa7b4; margin:0 0 1rem; }
  .frame { position:relative; line-height:0; border-radius:8px; overflow:hidden; background:#000; }
  .frame video { width:100%; display:block; }
  .bands { position:absolute; display:grid; pointer-events:none; }
  .band { border-bottom:1px dashed rgba(255,255,255,.3); }
  .band:last-child { border-bottom:0; }
  .band span { font:11px system-ui; padding:2px 6px; text-shadow:0 0 3px #000; line-height:1.2; display:inline-block; }
  .strait-box { position:absolute; border:1.5px solid #38bdf8; border-radius:4px; pointer-events:none; box-shadow:0 0 8px rgba(56,189,248,.4); }
  .strait-box span { position:absolute; top:-16px; left:0; font:10px system-ui; color:#38bdf8; text-shadow:0 0 3px #000; white-space:nowrap; }
  .controls { display:flex; gap:1rem; align-items:center; margin:1rem 0; flex-wrap:wrap; }
  .layers { display:flex; gap:.9rem; align-items:center; margin:0 0 1rem; flex-wrap:wrap; background:#151b23; padding:.6rem .9rem; border-radius:8px; }
  .layers label { display:flex; align-items:center; gap:.35rem; font-size:.9rem; cursor:pointer; }
  .swatch { width:12px; height:3px; display:inline-block; border-radius:2px; }
  #seek { flex:1; min-width:160px; }
  select { background:#151b23; color:#e6edf3; border:1px solid #2b3542; border-radius:6px; padding:.4rem .5rem; }
  button { background:#2f81f7; color:#fff; border:0; border-radius:6px; padding:.6rem 1.2rem; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  #chart { width:100%; height:230px; display:block; background:#0f141a; border-radius:8px; cursor:pointer; }
  .readout { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:.75rem; margin-top:1rem; }
  .card { background:#151b23; border-radius:8px; padding:.6rem .8rem; }
  .card small { color:#9aa7b4; display:block; }
  .card b { font-size:1.1rem; }
  #status, #timeLbl { color:#9aa7b4; }
</style>
</head>
<body>
<main>
  <h1>Earth Jukebox · Time-lapse</h1>
  <p class="sub" id="subtitle">Loading…</p>

  <div class="frame">
    <video id="vid" muted playsinline preload="auto"></video>
    <div class="bands" id="bandOverlay"></div>
    <div class="strait-box" id="straitOverlay" style="display:none;"><span>Gibraltar Jet</span></div>
  </div>

  <div class="controls">
    <button id="playBtn" disabled>▶ Play</button>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
    <span id="timeLbl">0:00 / 0:00</span>
    <label>Pitch
      <select id="mode">
        <option value="relative">Relative </option>
        <option value="absolute">Absolute </option>
      </select>
    </label>
    <label>Volume <input id="vol" type="range" min="-30" max="0" value="-6" /></label>
    <span id="status">Loading…</span>
  </div>

  <div class="layers" role="group" aria-label="Instrument Layers">
    <strong style="font-size:.85rem; color:#9aa7b4;">Instruments & Plot:</strong>
    <label><input type="checkbox" id="lyrChoir" checked /> 🎻 Latitudinal Choir (5 Bands)</label>
    <label><input type="checkbox" id="lyrEddy" checked /> <span class="swatch" style="background:#f472b6"></span> 🎶 Eddy Marimba (Swirl)</label>
    <label><input type="checkbox" id="lyrStrait" checked /> <span class="swatch" style="background:#38bdf8"></span> 🌬️ Gibraltar Flute (Jet)</label>
    <label><input type="checkbox" id="lyrSurf" checked /> <span class="swatch" style="background:#94a3b8"></span> 🌊 Ocean Surf (Activity)</label>
  </div>

  <canvas id="chart" aria-label="Active instrument curves over time."></canvas>
  <div class="readout" id="readout"></div>
</main>

<script>
const CONFIG = {
  videoUrl: "assets/video/clip_01.mp4",
  featuresUrl: "data/video_features.json",
  mode: "relative",
  steps: 8,
  bandBase: [36, 48, 60, 48, 36],
  absSteps: 15,
  absBase: 36,
  scale: [0, 2, 4, 7, 9],
  smooth: 2
};
const COLORS = ["#7dd3fc", "#86efac", "#f87171", "#fbbf24", "#c4b5fd"];
const BAND_INSTRUMENTS = ["Cello", "E-Piano", "Reed", "Brass", "Chime"];
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const video = $("vid");

let meta, F, M, NB, FPS, bandsS, dS, gmS, actN, gmN, swirlN, straitS, straitN, straitMean, stepC, meanB, lo, hi, plot, yMin, yMax;
let audioReady = false, lastI = -1, dragging = false;
let voices = [], choirGain, eddySynth, eddyLoop, eddyGain, eddyStep = 0, straitSynth, straitGain, noiseGain, noiseFilter;

function smooth(a, k) {
  return a.map((_, i) => {
    let s = 0, n = 0;
    for (let j = Math.max(0, i - k); j <= Math.min(a.length - 1, i + k); j++) { s += a[j]; n++; }
    return s / n;
  });
}
function norm(a) {
  const min = Math.min(...a), max = Math.max(...a);
  return a.map(x => (max > min ? (x - min) / (max - min) : 0.5));
}
const dataDur = () => (M - 1) / FPS;
const vidDur = () => (isFinite(video.duration) ? video.duration : meta.duration);

// ---------- load ----------
async function load() {
  video.addEventListener("error", () => { $("status").textContent = "Could not load " + CONFIG.videoUrl; });
  video.src = CONFIG.videoUrl;

  try {
    const r = await fetch(CONFIG.featuresUrl);
    if (!r.ok) throw 0;
    const j = await r.json(); meta = j.meta; F = j.frames;
  } catch (e) {
    $("status").textContent = "Could not load data/video_features.json (run the extractor, then serve with: python serve.py)";
    return;
  }
  M = F.length; NB = meta.band_names.length; FPS = meta.feature_fps;
  const k = CONFIG.smooth;
  bandsS = meta.band_names.map((_, b) => smooth(F.map(f => f.bands[b]), k));
  dS = meta.band_names.map((_, b) => smooth(F.map(f => f.d_bands[b]), k));
  gmS = smooth(F.map(f => f.mean), k);
  actN = norm(smooth(F.map(f => f.activity), k));
  gmN = norm(gmS);

  const rawSwirl = F.map(f => f.swirl ?? f.activity ?? 0);
  const rawStrait = F.map(f => f.strait ?? f.mean ?? 0);
  swirlN = norm(smooth(rawSwirl, k));
  straitS = smooth(rawStrait, k);
  straitN = norm(straitS);
  straitMean = straitS.reduce((s, x) => s + x, 0) / M;

  meanB = bandsS.map(a => a.reduce((s, x) => s + x, 0) / M);
  const swing = Math.max(...bandsS.map(a => Math.max(...a) - Math.min(...a)));
  stepC = Math.max(swing, 0.01) / (CONFIG.steps - 1);
  const all = bandsS.flat(); lo = Math.min(...all); hi = Math.max(...all);

  // Band overlay
  const cf = meta.crop_frac, ov = $("bandOverlay");
  Object.assign(ov.style, { left: cf[0] * 100 + "%", top: cf[1] * 100 + "%",
    width: (cf[2] - cf[0]) * 100 + "%", height: (cf[3] - cf[1]) * 100 + "%",
    gridTemplateRows: `repeat(${NB},1fr)` });
  ov.innerHTML = meta.band_names.map((n, b) => `<div class="band"><span style="color:${COLORS[b % 5]}">${n} (${BAND_INSTRUMENTS[b % 5]})</span></div>`).join("");

  // Strait of Gibraltar box overlay
  if (meta.strait_box) {
    const sb = meta.strait_box, so = $("straitOverlay");
    so.style.display = "block";
    Object.assign(so.style, {
      left: (cf[0] + sb[0] * (cf[2] - cf[0])) * 100 + "%",
      top: (cf[1] + sb[1] * (cf[3] - cf[1])) * 100 + "%",
      width: (sb[2] - sb[0]) * (cf[2] - cf[0]) * 100 + "%",
      height: (sb[3] - sb[1]) * (cf[3] - cf[1]) * 100 + "%"
    });
  }

  // Readout cards
  $("readout").innerHTML =
    `<div class="card"><small>Ocean Mean</small><b id="rGm">–</b></div>` +
    `<div class="card" style="border-left:4px solid #f472b6"><small>Eddy Swirl (Marimba)</small><b id="rSwirl">–</b></div>` +
    `<div class="card" style="border-left:4px solid #38bdf8"><small>Gibraltar Jet (Flute)</small><b id="rStrait">–</b><small id="rStraitN"></small></div>` +
    `<div class="card" style="border-left:4px solid #94a3b8"><small>Ocean Surf (Activity)</small><b id="rAct">–</b></div>` +
    meta.band_names.map((n, b) => `<div class="card" style="border-left:4px solid ${COLORS[b % 5]}"><small>${n} · ${BAND_INSTRUMENTS[b % 5]}</small><b id="rB${b}">–</b><small id="rN${b}"></small></div>`).join("");

  $("mode").value = CONFIG.mode;
  setMode(CONFIG.mode);

  const ready = () => { $("playBtn").disabled = false; $("status").textContent = ""; };
  if (video.readyState >= 1) ready(); else video.addEventListener("loadedmetadata", ready);
}

function updatePlotBounds() {
  const showChoir = $("lyrChoir").checked;
  const showStrait = $("lyrStrait").checked;
  plot = CONFIG.mode === "relative" ? bandsS.map((a, b) => a.map(v => v - meanB[b])) : bandsS;
  const straitPlot = CONFIG.mode === "relative" ? straitS.map(v => v - straitMean) : straitS;

  let activeSeries = [];
  if (showChoir) activeSeries.push(...plot);
  if (showStrait) activeSeries.push(straitPlot);

  if (activeSeries.length > 0) {
    const all = activeSeries.flat();
    yMin = Math.min(...all) - 1;
    yMax = Math.max(...all) + 1;
  } else {
    // Only 0-100% normalized layers (Eddy / Surf) are checked
    yMin = 0;
    yMax = 100;
  }
}

function setMode(m) {
  CONFIG.mode = m;
  updatePlotBounds();
  const stepTxt = m === "relative" ? stepC : ((hi - lo) || 1) / (CONFIG.absSteps - 1);
  $("subtitle").textContent =
    `${NB} ocean-masked bands · ${m} pitch · 1 step = ${stepTxt.toFixed(2)} pts · ${FPS.toFixed(1)} samples/s`;
  if (lastI >= 0) {
    applyVisuals(lastI);
    if (audioReady && !video.paused) applyAudio(lastI);
  }
}

// ---------- mapping ----------
function midiFor(b, i) {
  const S = CONFIG.scale;
  if (CONFIG.mode === "absolute") {
    const d = clamp(Math.round((bandsS[b][i] - lo) / ((hi - lo) || 1) * (CONFIG.absSteps - 1)), 0, CONFIG.absSteps - 1);
    return CONFIG.absBase + 12 * Math.floor(d / S.length) + S[d % S.length];
  }
  const d = clamp(Math.round((CONFIG.steps - 1) / 2 + (bandsS[b][i] - meanB[b]) / stepC), 0, CONFIG.steps - 1);
  return CONFIG.bandBase[b % 5] + 12 * Math.floor(d / S.length) + S[d % S.length];
}
function straitMidi(i) {
  const S = CONFIG.scale;
  const d = clamp(Math.round(straitN[i] * 10), 0, 10);
  return 60 + 12 * Math.floor(d / S.length) + S[d % S.length];
}
const freq = m => Tone.Frequency(m, "midi").toFrequency();
const noteName = m => Tone.Frequency(m, "midi").toNote();

// ---------- sound engine ----------
async function initAudio() {
  Tone.Destination.volume.value = +$("vol").value;
  const limiter = new Tone.Limiter(-1).toDestination();
  const reverb = new Tone.Reverb({ decay: 4.5, wet: 0.35 }).connect(limiter);
  await reverb.generate();

  choirGain = new Tone.Gain($("lyrChoir").checked ? 1 : 0).connect(reverb);
  const presets = [
    () => new Tone.Synth({ oscillator: { type: "fatsawtooth", count: 3, spread: 18 }, envelope: { attack: 1.8, release: 2 } }),
    () => new Tone.FMSynth({ harmonicity: 2, modulationIndex: 1.5, envelope: { attack: 1.2, release: 2 } }),
    () => new Tone.AMSynth({ harmonicity: 1.5, envelope: { attack: 1.0, release: 1.8 } }),
    () => new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 1.0, release: 1.8 } }),
    () => new Tone.FMSynth({ harmonicity: 3.5, modulationIndex: 3.5, envelope: { attack: 0.6, release: 2.5 } })
  ];
  for (let b = 0; b < NB; b++) {
    const pan = new Tone.Panner((NB - 1 - 2 * b) / (NB - 1) * 0.8).connect(choirGain);
    const filter = new Tone.Filter(1200, "lowpass").connect(pan);
    const v = presets[b % presets.length]().connect(filter);
    v.volume.value = b === 0 ? -15 : -19;
    v._filter = filter;
    voices.push(v);
  }

  eddyGain = new Tone.Gain($("lyrEddy").checked ? 1 : 0).connect(reverb);
  eddySynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 0.22, sustain: 0, release: 0.35 }
  }).connect(eddyGain);
  eddySynth.volume.value = -13;

  eddyLoop = new Tone.Loop(time => {
    if (lastI < 0 || video.paused) return;
    const b = eddyStep % NB;
    const octaveShift = swirlN[lastI] > 0.6 ? 24 : 12;
    const note = freq(midiFor(b, lastI) + octaveShift);
    const vel = 0.25 + 0.75 * swirlN[lastI];
    eddySynth.triggerAttackRelease(note, "16n", time, vel);
    eddyStep++;
  }, "8n").start(0);

  straitGain = new Tone.Gain($("lyrStrait").checked ? 1 : 0).connect(reverb);
  const vibrato = new Tone.Vibrato(4.5, 0.08).connect(straitGain);
  straitSynth = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.6, decay: 0.2, sustain: 0.9, release: 1.2 }
  }).connect(vibrato);
  straitSynth.volume.value = -18;

  noiseGain = new Tone.Gain(0).connect(reverb);
  noiseFilter = new Tone.Filter(1500, "bandpass").connect(noiseGain);
  const noise = new Tone.Noise("pink");
  noise.volume.value = -10;
  noise.connect(noiseFilter);
  noise.start();
}

function startSound() {
  if (!audioReady) return;
  const i = clamp(Math.round(video.currentTime * FPS), 0, M - 1);
  voices.forEach((v, b) => v.triggerAttack(freq(midiFor(b, i))));
  straitSynth.triggerAttack(freq(straitMidi(i)));
  Tone.Transport.start();
  lastI = -1;
}

function stopSound() {
  if (!audioReady) return;
  voices.forEach(v => v.triggerRelease());
  straitSynth.triggerRelease();
  Tone.Transport.pause();
  noiseGain.gain.rampTo(0, 0.5);
}

function applyAudio(i) {
  voices.forEach((v, b) => {
    v.frequency.rampTo(freq(midiFor(b, i)), 0.3);
    const warmth = clamp(bandsS[b][i] / 100, 0, 1);
    v._filter.frequency.rampTo(300 + warmth * 2600, 0.3);
  });

  Tone.Transport.bpm.rampTo(75 + swirlN[i] * 90, 0.3);

  straitSynth.frequency.rampTo(freq(straitMidi(i)), 0.25);
  straitSynth.volume.rampTo(-24 + straitN[i] * 12, 0.25);

  const surfTarget = $("lyrSurf").checked ? (0.01 + 0.12 * actN[i]) : 0;
  noiseGain.gain.rampTo(surfTarget, 0.3);
  noiseFilter.frequency.rampTo(500 + 3500 * gmN[i], 0.3);
}

// ---------- visuals ----------
function applyVisuals(i) {
  $("rGm").textContent = gmS[i].toFixed(1);
  $("rSwirl").textContent = (swirlN[i] * 100).toFixed(0) + "%";
  $("rStrait").textContent = straitS[i].toFixed(1);
  $("rStraitN").textContent = "note " + noteName(straitMidi(i));
  $("rAct").textContent = (actN[i] * 100).toFixed(0) + "%";
  for (let b = 0; b < NB; b++) {
    const d = dS[b][i];
    $("rB" + b).textContent = bandsS[b][i].toFixed(1) + " " + (Math.abs(d) < 0.005 ? "·" : d > 0 ? "▲" : "▼");
    $("rN" + b).textContent = "note " + noteName(midiFor(b, i));
  }
}

function draw(i) {
  const cv = $("chart"), ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const L = 40, R = 8, T = 8, B = 18, pw = w - L - R, ph = h - T - B;
  const x = k => L + k / (M - 1) * pw;
  const y = v => T + (1 - (v - yMin) / (yMax - yMin)) * ph;
  // Map 0..1 normalized intensity (Swirl / Surf) cleanly onto the current Y-axis height
  const yNorm = n => T + (1 - n) * ph;

  ctx.font = "11px system-ui"; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const v = yMin + (yMax - yMin) * g / 4;
    ctx.strokeStyle = "#222c38"; ctx.beginPath(); ctx.moveTo(L, y(v)); ctx.lineTo(w - R, y(v)); ctx.stroke();
    ctx.fillStyle = "#9aa7b4"; ctx.fillText(v.toFixed(0), 4, y(v) + 4);
  }
  ctx.fillText("0:00", L, h - 4); ctx.fillText(fmt(dataDur()), w - R - 28, h - 4);
  ctx.textAlign = "right";
  ctx.fillText(CONFIG.mode === "relative" ? "pitch follows: deviation from each band's own average"
                                          : "pitch follows: absolute index, one scale for all bands", w - R - 4, T + 12);
  ctx.textAlign = "left";

  // 1. Plot 5 Latitudinal Choir Bands (if checked)
  if ($("lyrChoir").checked) {
    for (let b = 0; b < NB; b++) {
      ctx.strokeStyle = COLORS[b % 5]; ctx.fillStyle = COLORS[b % 5]; ctx.lineWidth = 1.8;
      ctx.beginPath();
      plot[b].forEach((v, k) => (k ? ctx.lineTo(x(k), y(v)) : ctx.moveTo(x(k), y(v))));
      ctx.stroke();
      ctx.beginPath(); ctx.arc(x(i), y(plot[b][i]), 4.5, 0, 7); ctx.fill();
    }
  }

  // 2. Plot Gibraltar Jet Flute (if checked)
  if ($("lyrStrait").checked) {
    const straitPlot = CONFIG.mode === "relative" ? straitS.map(v => v - straitMean) : straitS;
    ctx.strokeStyle = "#38bdf8"; ctx.fillStyle = "#38bdf8"; ctx.lineWidth = 2.4;
    ctx.beginPath();
    straitPlot.forEach((v, k) => (k ? ctx.lineTo(x(k), y(v)) : ctx.moveTo(x(k), y(v))));
    ctx.stroke();
    ctx.beginPath(); ctx.arc(x(i), y(straitPlot[i]), 5.5, 0, 7); ctx.fill();
  }

  // 3. Plot Eddy Swirl Marimba intensity (if checked, dashed pink)
  if ($("lyrEddy").checked) {
    ctx.save();
    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = "#f472b6"; ctx.fillStyle = "#f472b6"; ctx.lineWidth = 2;
    ctx.beginPath();
    swirlN.forEach((n, k) => (k ? ctx.lineTo(x(k), yNorm(n)) : ctx.moveTo(x(k), yNorm(n))));
    ctx.stroke();
    ctx.restore();
    ctx.beginPath(); ctx.arc(x(i), yNorm(swirlN[i]), 5, 0, 7); ctx.fill();
  }

  // 4. Plot Ocean Surf Activity intensity (if checked, dotted slate)
  if ($("lyrSurf").checked) {
    ctx.save();
    ctx.setLineDash([2, 3]);
    ctx.strokeStyle = "#94a3b8"; ctx.fillStyle = "#94a3b8"; ctx.lineWidth = 1.8;
    ctx.beginPath();
    actN.forEach((n, k) => (k ? ctx.lineTo(x(k), yNorm(n)) : ctx.moveTo(x(k), yNorm(n))));
    ctx.stroke();
    ctx.restore();
    ctx.beginPath(); ctx.arc(x(i), yNorm(actN[i]), 4.5, 0, 7); ctx.fill();
  }

  // Playhead cursor
  const px = L + clamp(video.currentTime / dataDur(), 0, 1) * pw;
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(px, T); ctx.lineTo(px, T + ph); ctx.stroke();
}

function tick() {
  requestAnimationFrame(tick);
  if (!F) return;
  const i = clamp(Math.round(video.currentTime * FPS), 0, M - 1);
  if (i !== lastI) {
    applyVisuals(i);
    if (audioReady && !video.paused) applyAudio(i);
    lastI = i;
  }
  if (!dragging) $("seek").value = video.currentTime / vidDur() * 1000;
  $("timeLbl").textContent = `${fmt(video.currentTime)} / ${fmt(vidDur())}`;
  draw(i);
}

// ---------- controls ----------
$("playBtn").addEventListener("click", async () => {
  if (!video.paused) { video.pause(); return; }
  $("playBtn").disabled = true;
  await Tone.start();
  if (!audioReady) { $("status").textContent = "Building sound engine…"; await initAudio(); audioReady = true; $("status").textContent = ""; }
  $("playBtn").disabled = false;
  try { await video.play(); } catch (e) { $("status").textContent = "Video failed to play: " + e.message; }
});
video.addEventListener("play", () => { $("playBtn").textContent = "❚❚ Pause"; startSound(); });
video.addEventListener("pause", () => { $("playBtn").textContent = "▶ Play"; stopSound(); });
video.addEventListener("ended", stopSound);
$("seek").addEventListener("input", e => { dragging = true; video.currentTime = e.target.value / 1000 * vidDur(); });
$("seek").addEventListener("change", () => { dragging = false; });
$("mode").addEventListener("change", e => { if (F) setMode(e.target.value); });
$("chart").addEventListener("click", e => {
  if (!F) return;
  const r = e.currentTarget.getBoundingClientRect();
  video.currentTime = clamp((e.clientX - r.left - 40) / (r.width - 48), 0, 1) * dataDur();
});
$("vol").addEventListener("input", e => { if (audioReady) Tone.Destination.volume.value = +e.target.value; });

// Layer mute/unmute + chart sync listeners
$("lyrChoir").addEventListener("change", e => {
  if (choirGain) choirGain.gain.rampTo(e.target.checked ? 1 : 0, 0.2);
  $("bandOverlay").style.opacity = e.target.checked ? "1" : "0.25";
  updatePlotBounds();
});
$("lyrEddy").addEventListener("change", e => {
  if (eddyGain) eddyGain.gain.rampTo(e.target.checked ? 1 : 0, 0.2);
  updatePlotBounds();
});
$("lyrStrait").addEventListener("change", e => {
  if (straitGain) straitGain.gain.rampTo(e.target.checked ? 1 : 0, 0.2);
  $("straitOverlay").style.display = e.target.checked ? "block" : "none";
  updatePlotBounds();
});
$("lyrSurf").addEventListener("change", e => {
  if (noiseGain && !e.target.checked) noiseGain.gain.rampTo(0, 0.2);
  updatePlotBounds();
});

load();
requestAnimationFrame(tick);
</script>
</body>
</html>
