<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Earth Jukebox - setup test</title>
  <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
</head>
<body style="font-family: sans-serif; padding: 2rem;">
  <h1>Earth Jukebox: setup test</h1>
  <button id="play">Play test note</button>
  <p id="status">Waiting for click...</p>

  <script>
    document.getElementById("play").addEventListener("click", async () => {
      await Tone.start(); // browsers require a user click before audio
      const synth = new Tone.Synth().toDestination();
      synth.triggerAttackRelease("C4", "8n");
      document.getElementById("status").textContent = "Audio context: " + Tone.context.state;
    });
  </script>
</body>
</html>
